<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عيادة النساء والتوليد</title>
  <!-- مكتبة الأيقونات Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #faf9f6; color: #2c3e50; line-height: 1.6; }
    .hidden { display: none !important; }
    
    /* الأزرار */
    .btn-primary { background-color: #b49655; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
    .btn-primary:hover { background-color: #89660e; }
    .btn-secondary { background-color: transparent; color: #2c3e50; border: 1px solid #2c3e50; padding: 10px 20px; border-radius: 8px; text-decoration: none; cursor: pointer; font-weight: 600; }
    
    /* الهيدر */
    .hero { background: linear-gradient(135deg, #ffffff 0%, #f3efe6 100%); padding: 20px 8% 80px; border-bottom: 1px solid #e5e0d5; }
    .navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; }
    .logo { font-size: 1.5rem; font-weight: bold; color: #89660e; }
    .hero-content { max-width: 600px; }
    .hero-content h1 { font-size: 2.5rem; margin-bottom: 15px; color: #1a252f; }
    .hero-content p { font-size: 1.1rem; color: #555; margin-bottom: 25px; }
    .hero-actions { display: flex; gap: 15px; flex-wrap: wrap; }

    /* الحاسبة */
    .calc-section { padding: 60px 8%; display: flex; justify-content: center; }
    .calc-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 500px; width: 100%; text-align: center; }
    .calc-card h2 { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; color: #89660e; font-size: 1.3rem; }
    .calc-input-group { display: flex; gap: 10px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }
    input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 100%; margin-bottom: 15px; }
    .calc-result { margin-top: 20px; padding: 15px; background-color: #f3efe6; border-radius: 8px; color: #89660e; }

    /* النافذة المنبثقة Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
    .modal-overlay.is-open { display: flex; }
    .modal-box { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    .modal-box h3 { margin-bottom: 20px; color: #89660e; }
    .step-panel { display: none; }
    .step-panel.is-active { display: block; }
    .step-buttons { display: flex; justify-content: space-between; gap: 10px; }
    .full-width { width: 100%; justify-content: center; }
    .success-box { text-align: center; padding: 20px 0; }
    .success-icon { color: #27ae60; width: 48px; height: 48px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- الهيدر والصفحة الرئيسية -->
  <header class="hero">
    <nav class="navbar">
      <div class="logo">عيادة الأمل</div>
      <button class="btn-primary" data-modal-open>
        <i data-lucide="calendar"></i> احجز موعداً
      </button>
    </nav>
    <div class="hero-content">
      <h1>رعاية متكاملة لصحتكِ وصحة جنينكِ</h1>
      <p>نرافقكِ خطوة بخطوة بأحدث التقنيات الطبية واهتمام شخصي.</p>
      <div class="hero-actions">
        <button class="btn-primary" data-modal-open>حجز استشارة طبية</
