<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>العيادة الطبية</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #faf9f6; color: #2c3e50; line-height: 1.6; }
    .hidden { display: none !important; }
    
    .btn { background: #b49655; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #89660e; }
    
    header { padding: 40px 8%; display: flex; justify-content: space-between; align-items: center; background: #fff; border-bottom: 1px solid #eee; }
    h1 { font-size: 2rem; color: #1a252f; margin-bottom: 10px; }

    section { padding: 40px 8%; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 450px; text-align: center; }
    input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 100%; margin-bottom: 12px; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
    .modal.is-open { display: flex; }
    .modal-box { background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 400px; position: relative; }
    .close { position: absolute; top: 10px; left: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    .step { display: none; }
    .step.is-active { display: block; }
  </style>
</head>
<body>

  <header>
    <h2>عيادة الأمل</h2>
    <button class="btn" onclick="toggleModal(true)">احجز موعداً</button>
  </header>

  <main style="padding: 40px 8%; text-align: center;">
    <h1>رعاية متكاملة لصحتكِ</h1>
    <p style="color: #666; margin-bottom: 20px;">نرافقكِ بأحدث التقنيات الطبية.</p>
    <button class="btn" onclick="toggleModal(true)">حجز استشارة</button>
  </main>

  <section>
    <div class="card">
      <h3>حاسبة موعد الولادة</h3>
      <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">أدخلي تاريخ أول يوم من آخر دورة:</p>
      <input type="date" id="lastPeriod">
      <button class="btn" style="width:100%" onclick="calc()">احسبي الآن</button>
      <div id="calcResult" class="hidden" style="margin-top: 15px; padding: 10px; background: #f3efe6; border-radius: 6px; color: #89660e;">
        الموعد المتوقع: <strong id="dueDateText"></strong>
      </div>
    </div>
  </section>

  <!-- Modal -->
  <div id="bookingModal" class="modal">
    <div class="modal-box">
      <button class="close" onclick="toggleModal(false)">&times;</button>
      <h3 style="margin-bottom: 15px; color: #89660e;">حجز موعد</h3>
      
      <form id="form" onsubmit="event.preventDefault(); document.getElementById('form').classList.add('hidden'); document.getElementById('success').classList.remove('hidden');">
        <div class="step is-active" id="step1">
          <input type="text" placeholder="الاسم الكامل" required>
          <input type="tel" placeholder="رقم الهاتف" required>
          <button type="button" class="btn" style="width:100%" onclick="setStep(2)">التالي</button>
        </div>
        <div class="step" id="step2">
          <select><option>متابعة حمل</option><option>استشارة عامة</option></select>
          <input type="date" required>
          <div style="display:flex; gap:10px;">
            <button type="button" class="btn" style="background:#ccc; color:#000; width:50%" onclick="setStep(1)">رجوع</button>
            <button type="submit" class="btn" style="width:50%">تأكيد</button>
          </div>
        </div>
      </form>

      <div id="success" class="hidden" style="text-align:center; padding: 20px 0;">
        <h4>تم الاستلام بنجاح!</h4>
        <button class="btn" style="margin-top:15px; width:100%" onclick="toggleModal(false)">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById("bookingModal");
    const toggleModal = (open) => modal.classList.toggle("is-open", open);
    const setStep = (n) => {
      document.getElementById("step1").classList.toggle("is-active", n === 1);
      document.getElementById("step2").classList.toggle("is-active", n === 2);
    };
    function calc() {
      const val = document.getElementById("lastPeriod").value;
      if (!val) return;
      const date = new Date(new Date(val).getTime() + (280 * 86400000));
      document.getElementById("dueDateText").innerText = date.toLocaleDateString('fr-FR');
      document.getElementById("calcResult").classList.remove("hidden");
    }
  </script>
</body>
</html>
